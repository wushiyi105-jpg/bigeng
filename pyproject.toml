[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bigeng"
version = "0.1.0"
description = "润色、改写、扩写缩写、换风格、起标题,存历史版本"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
bigeng = "bigeng.cli:main"

[tool.setuptools]
packages = ["bigeng"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
